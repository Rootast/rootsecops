name: Bug report
description: Report a reproducible problem using sanitized information.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Never include .env files, tokens, or private scan results."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a public or synthetic sample.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/release, OS, CPU architecture, Docker and affected scanner versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
